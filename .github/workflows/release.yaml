name: Release

on:
  release:
    types:
      - published
  # Allow publishing a release by pushing a version tag, so a fix that is
  # already on main doesn't stay unreleased.
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          tag="${{ github.event.release.tag_name || github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Update manifest version
        run: |
          jq --arg v "${{ steps.release.outputs.version }}" '.version = $v' custom_components/urbanhello_remi/manifest.json > tmp.json
          mv tmp.json custom_components/urbanhello_remi/manifest.json

      - name: Create release zip
        run: |
          cd custom_components
          zip -r ../urbanhello_remi_hass.zip urbanhello_remi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: urbanhello_remi_hass.zip
